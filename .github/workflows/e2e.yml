name: CI

on:
  push:
    branches:
      - e2e-tests
  pull_request:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FOUNDRY_WAIT_MS: '600000'
      FOUNDRY_CACHE_VERSION: '14.364'
      FOUNDRY_CORE_VERSION: '14.364'

    steps:
      - name: Checkout system repository
        uses: actions/checkout@v6

      - name: Checkout Quench tests
        uses: actions/checkout@v6
        with:
          repository: Achoobert/coc7-system-tests
          # repository: Miskatonic-Investigative-Society/coc7-system-tests # restore once testing is done.
          ref: develop
          path: coc7-system-tests

      - name: Install system dependencies
        run: npm install
      # TODO cleaner setup
      - name: patch webpack 
        run: |
          npm install --save-dev terser-webpack-plugin webpack js-yaml

      - name: Install Quench test dependencies
        working-directory: coc7-system-tests
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install -D webpackbar@^7

      - name: Run Foundry E2E
        uses: Achoobert/FoundryvttTestEnv@0.0.10
        with:
          foundry_version: '14.364'
          foundry_world: coc7-test
          test_system_manifest_url: local
          test_module_ids: quench,coc7-system-tests # these will be enabled in the world, and installed if they aren't created by other build seteps
          build_script: |
            set -e
            userdata="$(pwd)/foundrydata"
            mkdir -p "$userdata"
            # webpack outputs to <prefix>/Data/systems/CoC7; point the prefix at foundrydata
            printf '{\n  "currentSelection": "ci",\n  "ci": "%s"\n}\n' "$userdata" > fvtt.config.json
            # binary packs must exist before webpack validates (binary-packs/*/LOCK)
            npm run compendiums-build
            npm run manuals-build
            npm run roll-requests-build
            npm run build
          quench_tests_path: ./coc7-system-tests
          quench_build_command: npm --prefix coc7-system-tests run build
          foundry_username: ${{ secrets.FOUNDRY_USERNAME }}
          foundry_password: ${{ secrets.FOUNDRY_PASSWORD }}
          foundry_admin_key: ${{ secrets.FOUNDRY_ADMIN_KEY }}
