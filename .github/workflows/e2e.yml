name: CI

on:
  push:
    branches:
      - e2e-tests
  pull_request:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FOUNDRY_WAIT_MS: '600000'
      FOUNDRY_CACHE_VERSION: '14.364'
      FOUNDRY_CORE_VERSION: '14.364'

    steps:
      - name: Checkout system repository
        uses: actions/checkout@v6

      - name: Checkout Quench tests
        uses: actions/checkout@v6
        with:
          repository: Miskatonic-Investigative-Society/coc7-system-tests
          ref: develop
          path: coc7-system-tests

      - name: Install system dependencies
        run: npm ci

      - name: Install Quench test dependencies
        working-directory: coc7-system-tests
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run Foundry E2E
        uses: Achoobert/FoundryvttTestEnv@0.0.7
        with:
          foundry_version: '14.364'
          foundry_world: coc7-test
          test_system_manifest_url: local
          test_module_ids: quench,coc7-system-tests # these will be enabled in the world, and installed if they aren't created by other build seteps
          build_script: |
            dest=foundrydata/Data/systems/coc7
            npm run build:css
            bash build/build-packs.sh
            mkdir -p "$dest"
            rsync -a \
              --exclude '.git' --exclude 'node_modules' --exclude 'foundrydata' --exclude '.foundry-docker' --exclude 'scss' --exclude 'packs/source' \
              system.json LICENSE.txt module css lang templates packs assets \
              "$dest/"
          quench_tests_path: ./coc7-system-tests
          quench_build_command: npm --prefix coc7-system-tests run build
          foundry_username: ${{ secrets.FOUNDRY_USERNAME }}
          foundry_password: ${{ secrets.FOUNDRY_PASSWORD }}
          foundry_admin_key: ${{ secrets.FOUNDRY_ADMIN_KEY }}
